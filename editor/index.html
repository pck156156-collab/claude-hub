<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hub Engine — 게임 만들기</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="easy">
  <header class="toolbar">
    <strong class="logo"><span class="easy-only">🎮 게임 만들기</span><span class="pro-only">◆ Hub Engine</span></strong>
    <span id="project-title" class="project-title"></span>
    <div class="group">
      <button data-action="new" title="새 프로젝트"><span class="easy-only tb"><i>🆕</i>새로</span><span class="pro-only">새로 만들기</span></button>
      <button data-action="open" title="프로젝트 파일 열기 (Ctrl+O)"><span class="easy-only tb"><i>📂</i>불러오기</span><span class="pro-only">열기</span></button>
      <button data-action="save" title="프로젝트 파일로 저장 (Ctrl+S)"><span class="easy-only tb"><i>💾</i>저장</span><span class="pro-only">저장</span></button>
      <button data-action="export" title="실행 가능한 HTML 게임 파일로 내보내기"><span class="easy-only tb"><i>🎁</i>게임 파일</span><span class="pro-only">게임 내보내기</span></button>
    </div>
    <div class="group">
      <button data-action="undo" title="되돌리기 (Ctrl+Z)"><span class="easy-only tb"><i>↩️</i>되돌리기</span><span class="pro-only">↶</span></button>
      <button data-action="redo" title="다시 하기 (Ctrl+Y)"><span class="easy-only tb"><i>↪️</i>다시</span><span class="pro-only">↷</span></button>
    </div>
    <div class="group tools">
      <button data-tool="paint" title="그리기 (B)"><span class="easy-only tb"><i>✏️</i>그리기</span><span class="pro-only">칠하기</span></button>
      <button data-tool="erase" title="지우기 (E)"><span class="easy-only tb"><i>🧽</i>지우기</span><span class="pro-only">지우기</span></button>
      <button data-tool="select" title="옮기기/고르기 (V)"><span class="easy-only tb"><i>✋</i>옮기기</span><span class="pro-only">선택</span></button>
    </div>
    <div class="group pro-only">
      <label class="check"><input type="checkbox" id="opt-snap" checked /> 격자 맞춤</label>
      <label class="check"><input type="checkbox" id="opt-grid" checked /> 격자</label>
      <label class="check"><input type="checkbox" id="opt-viewport" checked /> 화면 영역</label>
    </div>
    <div class="spacer"></div>
    <button class="play" data-action="play" title="실행 (F5)"><span class="easy-only tb"><i>▶️</i>놀이하기</span><span class="pro-only">▶ 실행</span></button>
    <button class="mode" data-action="mode" title="화면 모드 바꾸기"><span class="easy-only tb"><i>🧑‍💻</i>전문가</span><span class="pro-only">🧒 쉬운 모드</span></button>
  </header>

  <aside class="left">
    <section class="panel">
      <h2><span class="easy-only">🗺️ 단계</span><span class="pro-only">씬</span>
        <button class="icon" data-action="add-scene" title="단계(씬) 추가">＋</button></h2>
      <ul id="scene-list" class="list"></ul>
    </section>
    <section class="panel palette-panel">
      <h2><span class="easy-only">🧱 무엇을 그릴까요?</span><span class="pro-only">프리팹 <small>클릭: 브러시 선택</small></span></h2>
      <div id="palette" class="palette"></div>
    </section>
    <section class="panel grow pro-only">
      <h2>계층 구조 <small id="entity-count"></small></h2>
      <ul id="hierarchy" class="list"></ul>
    </section>
  </aside>

  <main class="viewport">
    <canvas id="scene-canvas"></canvas>
    <div class="zoom-buttons">
      <button data-action="zoom-in" title="크게 보기">➕</button>
      <button data-action="zoom-out" title="작게 보기">➖</button>
    </div>
    <div id="game-overlay" class="game-overlay" hidden>
      <div class="game-frame">
        <canvas id="game-canvas"></canvas>
        <div id="touch-area" class="touch-area"></div>
        <div class="game-help">
          <p><span class="easy-only">⬅️ ➡️ 방향키로 움직이고, 스페이스바로 점프해요!</span><span class="pro-only">방향키/WASD 이동 · Space 점프 · R 재시작 · P 일시정지 · Esc 정지</span></p>
          <button class="stop" data-action="stop">⏹ <span class="easy-only">그만하고 고치러 가기</span><span class="pro-only">정지</span></button>
        </div>
      </div>
    </div>
  </main>

  <aside class="right">
    <section class="panel grow">
      <h2><span class="easy-only">🎨 꾸미기</span><span class="pro-only">인스펙터</span></h2>
      <div id="inspector" class="pro-only"></div>
      <div id="easy-panel" class="easy-only"></div>
    </section>
  </aside>

  <footer class="bottom">
    <div class="helper easy-only">
      <div class="helper-face">🦉</div>
      <div class="helper-body">
        <div id="helper-message" class="helper-message"></div>
        <ol id="helper-steps" class="helper-steps"></ol>
      </div>
    </div>
    <div class="console-head pro-only">
      <span>콘솔</span>
      <button class="icon" data-action="clear-console" title="콘솔 지우기">⌫</button>
      <span id="status" class="status"></span>
    </div>
    <div id="console" class="console pro-only"></div>
  </footer>

  <input type="file" id="file-input" accept=".json,application/json" hidden />
  <script type="module" src="./main.js"></script>
</body>
</html>
