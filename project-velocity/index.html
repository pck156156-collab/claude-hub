<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Velocity</title>
  </head>
  <body>
    <div id="app"></div>

    <div class="hud hud-title"><span class="title-mark" aria-hidden="true"></span>PROJECT VELOCITY</div>

    <div class="hud hud-controls" aria-label="조작 안내">
      <div class="ctl"><span class="keys"><kbd>W</kbd></span><span>가속</span></div>
      <div class="ctl"><span class="keys"><kbd>S</kbd></span><span>브레이크 · 후진</span></div>
      <div class="ctl"><span class="keys"><kbd>A</kbd><kbd>D</kbd></span><span>조향</span></div>
      <div class="ctl"><span class="keys"><kbd class="wide">SPACE</kbd></span><span>핸드브레이크</span></div>
      <div class="ctl"><span class="keys"><kbd>R</kbd></span><span>위치 복구</span></div>
    </div>

    <div class="hud hud-speed" id="hud-speed">
      <svg class="gauge" viewBox="0 0 220 128" aria-hidden="true">
        <path class="gauge-track" d="M 20 118 A 90 90 0 0 1 200 118" pathLength="100" />
        <path class="gauge-fill" id="gauge-fill" d="M 20 118 A 90 90 0 0 1 200 118" pathLength="100" />
        <g id="gauge-ticks"></g>
      </svg>
      <div class="speed-readout">
        <span id="speed-value" class="speed-value">0</span>
        <span class="speed-unit">km/h</span>
      </div>
      <span id="gear" class="gear-chip">N</span>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
