<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Velocity</title>
  </head>
  <body>
    <div id="app"></div>

    <div class="hud hud-title"><span class="title-mark" aria-hidden="true"></span>PROJECT VELOCITY</div>

    <div class="hud hud-controls" aria-label="조작 안내">
      <div class="ctl"><span class="keys"><kbd>W</kbd></span><span>가속</span></div>
      <div class="ctl"><span class="keys"><kbd>S</kbd></span><span>브레이크 · 후진</span></div>
      <div class="ctl"><span class="keys"><kbd>A</kbd><kbd>D</kbd></span><span>조향</span></div>
      <div class="ctl"><span class="keys"><kbd class="wide">SPACE</kbd></span><span>핸드브레이크</span></div>
      <div class="ctl"><span class="keys"><kbd>R</kbd></span><span>위치 복구</span></div>
    </div>

    <div class="hud hud-speed" id="hud-speed">
      <svg class="gauge" viewBox="0 0 220 128" aria-hidden="true">
        <path class="gauge-track" d="M 20 118 A 90 90 0 0 1 200 118" pathLength="100" />
        <path class="gauge-fill" id="gauge-fill" d="M 20 118 A 90 90 0 0 1 200 118" pathLength="100" />
        <g id="gauge-ticks"></g>
      </svg>
      <div class="speed-readout">
        <span id="speed-value" class="speed-value">0</span>
        <span class="speed-unit">km/h</span>
      </div>
      <span id="gear" class="gear-chip">N</span>
    </div>

    <!-- 시작 화면 -->
    <div class="screen" id="screen-title" role="dialog" aria-labelledby="title-heading">
      <div class="panel">
        <p class="eyebrow">3D ARCADE RACING</p>
        <h1 id="title-heading" class="logo"><span class="title-mark" aria-hidden="true"></span>PROJECT VELOCITY</h1>
        <ul class="howto">
          <li><kbd>W</kbd> 가속 <kbd>S</kbd> 브레이크·후진 <kbd>A</kbd><kbd>D</kbd> 조향</li>
          <li><kbd class="wide">SPACE</kbd> 핸드브레이크(드리프트) <kbd>R</kbd> 안전 지점으로 복구</li>
          <li><kbd>ESC</kbd> 일시정지 <kbd>F3</kbd> 개발자 정보</li>
        </ul>
        <div class="setting">
          <span class="setting-label">그래픽 품질</span>
          <div class="quality-group" role="group" aria-label="그래픽 품질"></div>
        </div>
        <button type="button" class="primary" id="btn-start">게임 시작 <span class="hint">Enter</span></button>
      </div>
    </div>

    <!-- 일시정지 화면 -->
    <div class="screen" id="screen-pause" role="dialog" aria-labelledby="pause-heading" hidden>
      <div class="panel">
        <h2 id="pause-heading">일시정지</h2>
        <p class="muted" id="pause-reason"></p>
        <div class="setting">
          <span class="setting-label">그래픽 품질</span>
          <div class="quality-group" role="group" aria-label="그래픽 품질"></div>
        </div>
        <button type="button" class="primary" id="btn-resume">계속하기 <span class="hint">ESC</span></button>
      </div>
    </div>

    <!-- 오류 화면 (그래픽 장치 손실 등) -->
    <div class="screen" id="screen-error" role="alertdialog" aria-labelledby="error-title" hidden>
      <div class="panel">
        <h2 id="error-title">그래픽 오류</h2>
        <p class="muted" id="error-text"></p>
      </div>
    </div>

    <!-- 개발자 디버그 패널 (F3) -->
    <div class="debug-panel" id="debug-panel" hidden><div class="debug-grid" id="debug-text"></div></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
